version: '3'

tasks:
  run:
    desc: 'APIサーバーを起動'
    cmd: go run ./cmd/server/main.go

  build:
    desc: 'APIをビルド'
    cmd: go build -o bin/server ./cmd/server/main.go

  test:
    desc: 'テストを実行'
    cmd: go test -v ./...

  mod:tidy:
    desc: 'go.modを整理'
    cmd: go mod tidy

  mod:download:
    desc: '依存パッケージをダウンロード'
    cmd: go mod download

  vet:
    desc: 'go vetを実行'
    cmd: go vet ./...

  fmt:
    desc: 'コードをフォーマット'
    cmd: go fmt ./...

  lint:
    desc: 'golangci-lintを実行'
    cmd: golangci-lint run ./...

  setup:
    desc: '開発環境をセットアップ'
    cmds:
      - task: mod:download
      - echo "✅ セットアップ完了!"

  docker:shell:
    desc: 'APIコンテナにシェル接続'
    cmd: docker exec -it api sh

  docker:logs:
    desc: 'APIコンテナのログを表示'
    cmd: docker logs -f api

  generate:timetable:
    desc: 'PDFから時刻表JSONを生成 (usage: task api:generate:timetable -- --pdf path/to/timetable.pdf)'
    dir: tools/timetable-gen
    cmd: go run . {{.CLI_ARGS}}

  generate:timetable:setup:
    desc: 'timetable-gen の依存パッケージをインストール'
    dir: tools/timetable-gen
    cmd: go mod tidy

  default:
    desc: '利用可能なタスク一覧を表示'
    cmds:
      - task --list
    silent: true
