# ========================================
# Timetable Promote - main → dev
# ========================================
# timetable-sync が main へ直接PRを作るようになったため、
# main にマージされた変更を dev へ機械的に同期する（旧: dev→mainのPR自動作成）。
# このワークフローは main 上に存在して初めて発火する（push トリガーの仕様）。

name: 'Sync main → dev'

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync:
    name: 'Merge main into dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge main into dev
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # checkout は ref: dev しか取らないので、origin/main は明示的に取得する
          git fetch origin main

          if git diff --quiet origin/main origin/dev; then
            echo "dev と main に差分がありません。同期不要。"
            echo "status=no-op" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit origin/main; then
            git push origin dev
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "main → dev のマージでコンフリクトが発生しました。手動対応が必要です。"
            exit 1
          fi

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          JOB_STATUS="${{ job.status }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # 成功時（同期不要／マージ成功）は毎日通知が飛ぶとうるさいので送らない
          if [ "$JOB_STATUS" = "success" ]; then
            exit 0
          fi

          payload=$(jq -n \
            --arg title "main → dev の自動同期に失敗しました" \
            --arg description "コンフリクト等が発生しました。手動で dev に main を取り込んでください。" \
            --arg run_url "$RUN_URL" \
            --argjson color 15158332 \
            '{
              embeds: [{
                title: $title,
                description: $description,
                color: $color,
                fields: [{ name: "ワークフロー", value: $run_url, inline: false }]
              }]
            }')

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
