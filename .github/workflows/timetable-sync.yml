# ========================================
# Timetable Sync
# ========================================
# 毎日 0:00 JST（前日 15:00 UTC）にTUTサイトの時刻表PDFを確認し、
# 新規・更新があればJSONを再生成してPRを作成する
# （--extractor=geo 移行によりGemini APIコストが無くなったため、issue #213を機に週次から毎日へ変更）

name: 'Timetable Sync'

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      extractor:
        description: '抽出方式（issue #213 対応中の手動フォールバック用）'
        type: choice
        options: ['geo', 'gemini']
        default: 'geo'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: 'Sync Timetable Data'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/tools/timetable-gen/go.mod
          cache-dependency-path: apps/api/tools/timetable-gen/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        working-directory: apps/api/tools/timetable-gen
        run: pip install -r extractor/requirements.txt

      - name: Build timetable-gen
        working-directory: apps/api/tools/timetable-gen
        run: go build -o timetable-gen-bin .

      - name: Run Sync
        id: sync
        working-directory: apps/api/tools/timetable-gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXTRACTOR: ${{ github.event.inputs.extractor || 'geo' }}
        run: |
          # `|| true` を付けると $? が常に 0 になり失敗を取りこぼす（実際に
          # 2026-09-13 の Gemini 3回失敗が success 扱いで緑通知されていた）。
          # 失敗しても後続で生成済みの分はPRにしたいので、ここでは落とさず
          # 最後の Fail if sync failed でまとめて落とす。
          set +e
          OUTPUT=$(./timetable-gen-bin sync --output ../../data/services --extractor "$EXTRACTOR" 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          {
            echo 'sync_output<<EOF'
            echo "$OUTPUT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check
        if: always()
        run: |
          git add apps/api/data/services/
          STATE=apps/api/tools/timetable-gen/downloaded/.fetch-state.json
          [ -f "$STATE" ] && git add "$STATE"
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "変更なし。終了します。"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --staged --name-only
          fi

      - name: Create PR
        id: pr
        if: always() && steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/timetable-sync-$(date +%Y%m%d)-${{ github.run_id }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -m "chore: 時刻表データを自動更新"
          git push origin "$BRANCH"

          SYNC_OUTPUT="${{ steps.sync.outputs.sync_output }}"
          PDF_LINKS=$(echo "$SYNC_OUTPUT" | grep '^  URL: ' | sed -E 's/^  URL: (.+)$/- \1/')
          if [ -z "$PDF_LINKS" ]; then
            PDF_LINKS="(URL情報なし)"
          fi

          PR_URL=$(gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "chore: 時刻表データを自動更新 ($(date +%Y-%m-%d))" \
            --body "$(cat <<EOF
          ## 概要
          TUTサイトの時刻表PDFに新規・更新があったため、JSONデータを再生成しました。

          ## 元PDF
          $PDF_LINKS

          ## 確認事項
          - [ ] 追加・更新されたJSONファイルの時刻に異常がないか確認（上記URLと突き合わせる）

          🤖 Generated by timetable-sync workflow
          EOF
          )")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          JOB_STATUS="${{ job.status }}"
          SYNC_EXIT="${{ steps.sync.outputs.exit_code }}"
          SYNC_OUTPUT="${{ steps.sync.outputs.sync_output }}"
          HAS_CHANGES="${{ steps.check.outputs.has_changes }}"
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # 毎日実行なので「変更なし」で通知すると毎朝ノイズが飛ぶ。黙って終わる。
          if [ "$JOB_STATUS" = "success" ] && [ "$SYNC_EXIT" = "0" ] && [ "$HAS_CHANGES" != "true" ]; then
            echo "変更なし。通知しません。"
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ] && [ "$SYNC_EXIT" = "0" ]; then
            COLOR=3066993  # 緑
            TITLE="時刻表データを更新しました"
          else
            COLOR=15158332  # 赤
            if [ "$HAS_CHANGES" = "true" ]; then
              TITLE="時刻表 sync が一部失敗しました（生成できた分はPRあり）"
            else
              TITLE="時刻表 sync に失敗しました"
            fi
          fi

          DESCRIPTION="$SYNC_OUTPUT"
          if [ -n "$PR_URL" ]; then
            DESCRIPTION="${DESCRIPTION}"$'\n\n'"📋 PR: ${PR_URL}"
          fi

          payload=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg run_url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                description: $description,
                color: $color,
                fields: [{
                  name: "ワークフロー",
                  value: $run_url,
                  inline: false
                }]
              }]
            }')

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"

      # sync が失敗していたら、通知を送った後で run 自体も失敗させる
      - name: Fail if sync failed
        if: always() && steps.sync.outputs.exit_code != '0'
        run: |
          echo "sync が終了コード ${{ steps.sync.outputs.exit_code }} で失敗しました"
          exit 1
