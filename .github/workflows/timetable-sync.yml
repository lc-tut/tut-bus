# ========================================
# Timetable Sync
# ========================================
# 毎週月曜 0:00 JST（日曜 15:00 UTC）にTUTサイトの時刻表PDFを確認し、
# 新規・更新があればJSONを再生成してPRを作成する

name: 'Timetable Sync'

on:
  schedule:
    - cron: '0 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: 'Sync Timetable Data'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/tools/timetable-gen/go.mod
          cache-dependency-path: apps/api/tools/timetable-gen/go.sum

      - name: Run Sync
        working-directory: apps/api/tools/timetable-gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go run . sync --output ../../data/services

      - name: Check for changes
        id: check
        run: |
          git add apps/api/data/services/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "変更なし。終了します。"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --staged --name-only
          fi

      - name: Create PR
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/timetable-sync-$(date +%Y%m%d)"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -m "chore: 時刻表データを自動更新"
          git push origin "$BRANCH"
          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "chore: 時刻表データを自動更新 ($(date +%Y-%m-%d))" \
            --body "$(cat <<'EOF'
          ## 概要
          TUTサイトの時刻表PDFに新規・更新があったため、JSONデータを再生成しました。

          ## 確認事項
          - [ ] 追加・更新されたJSONファイルの時刻に異常がないか確認

          🤖 Generated by timetable-sync workflow
          EOF
          )"
