# ========================================
# Timetable Sync
# ========================================
# 毎週月曜 0:00 JST（日曜 15:00 UTC）にTUTサイトの時刻表PDFを確認し、
# 新規・更新があればJSONを再生成してPRを作成する

name: 'Timetable Sync'

on:
  schedule:
    - cron: '0 15 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: 'Sync Timetable Data'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/tools/timetable-gen/go.mod
          cache-dependency-path: apps/api/tools/timetable-gen/go.sum

      - name: Run Sync
        id: sync
        working-directory: apps/api/tools/timetable-gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          OUTPUT=$(go run . sync --output ../../data/services 2>&1) || true
          EXIT_CODE=$?
          echo "$OUTPUT"
          {
            echo 'sync_output<<EOF'
            echo "$OUTPUT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Check for changes
        id: check
        run: |
          git add apps/api/data/services/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "変更なし。終了します。"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --staged --name-only
          fi

      - name: Create PR
        id: pr
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/timetable-sync-$(date +%Y%m%d)-${{ github.run_id }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -m "chore: 時刻表データを自動更新"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "chore: 時刻表データを自動更新 ($(date +%Y-%m-%d))" \
            --body "$(cat <<'EOF'
          ## 概要
          TUTサイトの時刻表PDFに新規・更新があったため、JSONデータを再生成しました。

          ## 確認事項
          - [ ] 追加・更新されたJSONファイルの時刻に異常がないか確認

          🤖 Generated by timetable-sync workflow
          EOF
          )")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          JOB_STATUS="${{ job.status }}"
          SYNC_OUTPUT="${{ steps.sync.outputs.sync_output }}"
          HAS_CHANGES="${{ steps.check.outputs.has_changes }}"
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993  # 緑
            if [ "$HAS_CHANGES" = "true" ]; then
              TITLE="時刻表データを更新しました"
            else
              TITLE="時刻表データに変更はありませんでした"
            fi
          else
            COLOR=15158332  # 赤
            TITLE="時刻表 sync に失敗しました"
          fi

          DESCRIPTION="$SYNC_OUTPUT"
          if [ -n "$PR_URL" ]; then
            DESCRIPTION="$DESCRIPTION\n\n📋 PR: $PR_URL"
          fi

          payload=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg run_url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                description: $description,
                color: $color,
                fields: [{
                  name: "ワークフロー",
                  value: $run_url,
                  inline: false
                }]
              }]
            }')

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
