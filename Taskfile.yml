version: '3'

vars:
  DOCKER_COMPOSE: docker compose

includes:
  api:
    taskfile: ./apps/api/Taskfile.yml
    dir: ./apps/api
  web:
    taskfile: ./apps/web/Taskfile.yml
    dir: ./apps/web
  spec:
    taskfile: ./apps/spec/Taskfile.yml
    dir: ./apps/spec

tasks:
  up:
    desc: 'Docker環境を起動'
    cmd: '{{.DOCKER_COMPOSE}} up -d'

  down:
    desc: 'Docker環境を停止'
    cmd: '{{.DOCKER_COMPOSE}} down'

  restart:
    desc: 'Docker環境を再起動'
    cmds:
      - '{{.DOCKER_COMPOSE}} down'
      - '{{.DOCKER_COMPOSE}} up -d'

  logs:
    desc: 'Docker環境のログを表示'
    cmd: '{{.DOCKER_COMPOSE}} logs -f'

  logs:web:
    desc: 'webコンテナのログを表示'
    cmd: '{{.DOCKER_COMPOSE}} logs -f web'

  logs:api:
    desc: 'apiコンテナのログを表示'
    cmd: '{{.DOCKER_COMPOSE}} logs -f api'

  ps:
    desc: '実行中のコンテナを表示'
    cmd: '{{.DOCKER_COMPOSE}} ps'

  clean:
    desc: 'Docker環境を完全にクリーンアップ(ボリュームも削除)'
    cmd: '{{.DOCKER_COMPOSE}} down -v'

  setup:
    desc: '初回開発環境セットアップ'
    cmds:
      - pnpm install
      - task: up
      - echo "✅ セットアップ完了!"

  install:
    desc: '依存パッケージをインストール'
    cmd: pnpm install

  gen:spec:
    desc: 'OpenAPI仕様を生成'
    cmd: pnpm run gen:spec

  gen:clients:
    desc: 'TypeScript/Goクライアントを生成'
    cmd: pnpm run gen:clients

  gen:all:
    desc: 'すべてのコード生成を実行'
    cmds:
      - task: gen:spec
      - task: gen:clients

  fmt:
    desc: '全プロダクトのフォーマットを実行'
    cmds:
      - pnpm run fix
      - task: api:fmt
      - task: spec:fix
      - task: tf:fmt

  lint:
    desc: '全プロジェクトのLint実行'
    cmd: pnpm run lint

  fix:
    desc: '全プロジェクトの自動修正'
    cmd: pnpm run fix

  typecheck:
    desc: '全プロジェクトの型チェック'
    cmd: pnpm run typecheck

  build:
    desc: '全プロジェクトをビルド'
    cmd: pnpm run build

  build:web:
    desc: 'webプロジェクトをビルド'
    cmd: pnpm run build:web

  build:api:
    desc: 'apiプロジェクトをビルド'
    cmd: pnpm run build:api

  dev:
    desc: '開発サーバー起動(すべて)'
    cmds:
      - task: up

  dev:web:
    desc: 'webの開発サーバー起動'
    cmd: pnpm run dev:web

  # ========================================
  # Preview (production build) Tasks
  # Service Worker / PWA 動作確認用
  # ========================================
  preview:up:
    desc: 'PWA/SW テスト用の production preview を起動 (localhost:3001)'
    cmds:
      - |
        docker run -d --rm \
          --name web-preview \
          --network tut-bus_default \
          --env-file ./apps/web/.env \
          -e NODE_ENV=production \
          -v {{.ROOT_DIR}}/apps/web:/works \
          -p 3001:3000 \
          --entrypoint sh \
          $(docker build -q ./apps/web -f ./apps/web/dev.Dockerfile) \
          -c "corepack enable && corepack prepare pnpm@10.11.0 --activate && pnpm i && pnpm build && pnpm start"
      - echo "✅ preview 起動中... ビルド完了まで 1-2 分かかります"
      - echo "📡 http://localhost:3001"

  preview:down:
    desc: 'preview コンテナを停止・削除'
    cmds:
      - docker rm -f web-preview 2>/dev/null || true
      - echo "✅ preview 停止"

  preview:logs:
    desc: 'preview コンテナのログを表示'
    cmd: docker logs -f web-preview

  preview:rebuild:
    desc: 'preview を再ビルドして起動'
    cmds:
      - task: preview:down
      - task: preview:up

  default:
    desc: '利用可能なタスク一覧を表示'
    cmds:
      - task --list
    silent: true

  # ========================================
  # Terraform Tasks
  # ========================================
  tf:init:
    desc: 'Terraformを初期化'
    dir: infra
    cmd: terraform init

  tf:plan:
    desc: 'Terraformプランを表示'
    dir: infra
    cmd: terraform plan -var-file=production.tfvars

  tf:apply:
    desc: 'Terraformを適用'
    dir: infra
    cmd: terraform apply -var-file=production.tfvars

  tf:validate:
    desc: 'Terraform設定を検証'
    dir: infra
    cmd: terraform validate

  tf:fmt:
    desc: 'Terraform設定をフォーマット'
    dir: infra
    cmd: terraform fmt -recursive

  tf:output:
    desc: 'Terraform出力を表示'
    dir: infra
    cmd: terraform output
